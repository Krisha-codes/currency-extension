<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Krisha's Currency Exchange</title>
        <script src="exchange.js"></script>
    </head>
    <body>
        <h1>Exchange Rate Converter</h1>
        <input id="amount" type="number" placeholder="Enter an amount">
        <select id="currency">
            <option value="EUR">Euro</option>
            <option value="CAD">Canadian Pound</option>
            <option value="GBP">British Pound</option>
            <option value="JPY">Japanese Yen</option>
            <option value="INR">Indian Rupee</option>
        </select>
        <button id="convert">Convert Currency</button>
        <div id="result"></div>
    </body>
</html>
